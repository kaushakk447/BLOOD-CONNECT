services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bloodconnect
      POSTGRES_USER: bloodconnect_user
      POSTGRES_PASSWORD: bloodconnect_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodconnect_user -d bloodconnect"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/bloodconnect
      DB_USERNAME: bloodconnect_user
      DB_PASSWORD: bloodconnect_pass
      JWT_SECRET: local-development-secret-change-before-production-1234567890
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/auth/health | grep -q healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
