spring:
  application:
    name: bloodconnect-api
  
  datasource:
    url: jdbc:postgresql://localhost:5432/bloodconnect
    username: bloodconnect_user
    password: bloodconnect_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
  
  flyway:
    locations: classpath:db/migration
    enabled: true
  
  web:
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:5173"
      allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production-at-least-256-bits-long}
    expiration: 3600000
    refresh-expiration: 604800000

logging:
  level:
    root: INFO
    com.bloodconnect: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
